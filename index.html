<style>
  /* Westnetz Farbsystem */
  :root{
    --wn-blau:#003976;
    --wn-blau-hell:#0057a8;
    --wn-blau-mittel:#1a5fa8;
    --wn-akzent:#e4001b;
    --wn-gruen:#00843d;
    --wn-orange:#e87722;
    --wn-grau:#6e7275;
    --wn-grau-hell:#f4f5f6;
    --wn-grau-rand:#d0d3d4;
    --bg:#f4f5f6;
    --karte:#ffffff;
    --linie:#d0d3d4;
    --schrift:#1a1a1a;
    --schrift2:#6e7275;
    --radius:12px;
    --radius-s:7px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; background:var(--bg); color:var(--schrift); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:16px}
  body{display:flex; flex-direction:column; overflow:hidden}

  /* Header im Westnetz-Design */
  #kopf{
    background:var(--wn-blau); color:#fff; padding:0 16px;
    display:flex; align-items:center; gap:12px; flex-shrink:0; height:56px;
    box-shadow:0 2px 8px rgba(0,57,118,.35);
  }
  #kopf-logo{display:flex; align-items:center; gap:10px; flex:1}
  #kopf h1{font-size:16px; font-weight:600; letter-spacing:-.01em; line-height:1.2}
  #kopf h1 small{display:block; font-size:11px; font-weight:400; opacity:.75; letter-spacing:0}
  #online-punkt{width:8px; height:8px; border-radius:50%; background:#4ade80; flex-shrink:0}

  /* Nav Tabs */
  #nav{
    display:flex; background:var(--wn-blau); border-bottom:2px solid rgba(255,255,255,.12); flex-shrink:0;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #nav::-webkit-scrollbar{display:none}
  .nav-tab{
    flex:1; min-width:70px; padding:9px 4px 8px; text-align:center;
    font-size:10.5px; font-weight:600; color:rgba(255,255,255,.65); border:none;
    background:none; cursor:pointer; border-bottom:3px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    white-space:nowrap; letter-spacing:.02em; text-transform:uppercase;
    transition:color .15s, border-color .15s;
  }
  .nav-tab svg{flex-shrink:0}
  .nav-tab.aktiv{color:#fff; border-bottom-color:#fff; background:rgba(255,255,255,.08)}

  /* Hauptinhalt */
  #haupt{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:20px}
  #app{padding:12px}
  h2{font-size:19px; font-weight:700; color:var(--wn-blau); margin-bottom:14px; letter-spacing:-.02em}

  /* Karten */
  .karte{background:var(--karte); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .karte h3{font-size:12px; font-weight:700; color:var(--schrift2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px}

  /* Formulare */
  label{display:block; font-size:13px; font-weight:600; color:var(--schrift2); margin-bottom:4px; margin-top:12px}
  label:first-child{margin-top:0}
  input[type=text], input[type=date], textarea, select{
    width:100%; padding:11px 13px; border:1.5px solid var(--linie); border-radius:var(--radius-s);
    font-size:16px; color:var(--schrift); background:#fff; outline:none;
    -webkit-appearance:none; appearance:none; font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--wn-blau-hell); box-shadow:0 0 0 3px rgba(0,87,168,.13)}
  textarea{min-height:90px; resize:vertical; line-height:1.5}
  .checkbox-zeile{display:flex; align-items:center; gap:10px; padding:10px 0}
  .checkbox-zeile input[type=checkbox]{width:20px; height:20px; accent-color:var(--wn-blau)}
  .checkbox-zeile label{margin:0; font-size:15px; color:var(--schrift)}

  /* Mangel-Typ Toggle */
  .typ-toggle{display:flex; border:1.5px solid var(--linie); border-radius:var(--radius-s); overflow:hidden; margin-top:4px}
  .typ-toggle input[type=radio]{display:none}
  .typ-toggle label{
    flex:1; text-align:center; padding:11px 10px; font-size:14px; font-weight:600;
    color:var(--schrift2); background:#fff; cursor:pointer; margin:0;
    transition:background .15s, color .15s;
  }
  .typ-toggle input[type=radio]:checked + label{background:var(--wn-blau); color:#fff}
  .typ-toggle label:not(:last-child){border-right:1.5px solid var(--linie)}

  /* Buttons */
  .btn{
    display:block; width:100%; padding:13px; border:none; border-radius:var(--radius-s);
    font-size:15px; font-weight:700; cursor:pointer; text-align:center; margin-top:10px;
    font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:filter .15s;
  }
  .btn:active{filter:brightness(.92)}
  .btn-blau{background:var(--wn-blau); color:#fff}
  .btn-grau{background:var(--wn-grau-hell); color:var(--schrift)}
  .btn-gruen{background:var(--wn-gruen); color:#fff}
  .btn-rot{background:var(--wn-akzent); color:#fff}
  .btn-orange{background:var(--wn-orange); color:#fff}
  .btn-sm{font-size:12.5px; padding:9px 13px; width:auto; display:inline-flex; margin-top:0}
  .btn-reihe{display:flex; gap:8px; flex-wrap:wrap}
  .btn-reihe .btn{flex:1; margin-top:0; min-width:100px}

  /* Mängel-Karten im Logbuch */
  .mangel-karte{
    background:var(--karte); border-radius:var(--radius); padding:14px 14px 14px 16px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08);
    display:flex; align-items:flex-start; gap:12px; cursor:pointer;
    border-left:4px solid var(--linie); border-top:1px solid var(--linie);
    border-right:1px solid var(--linie); border-bottom:1px solid var(--linie);
    transition:border-color .15s, box-shadow .15s;
  }
  .mangel-karte:active{box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .mangel-karte.offen{border-left-color:var(--wn-orange)}
  .mangel-karte.behoben{border-left-color:var(--wn-gruen)}
  .mangel-karte.kritisch{border-left-color:var(--wn-akzent)}
  .mangel-info{flex:1; min-width:0}
  .mangel-kategorie{font-size:15px; font-weight:700; color:var(--schrift); margin-bottom:3px}
  .mangel-typ-badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px; margin-bottom:5px; letter-spacing:.03em}
  .mangel-typ-baumangel{background:#fef2f2; color:#991b1b}
  .mangel-typ-unfertig{background:#fefce8; color:#854d0e}
  .mangel-meta{font-size:12.5px; color:var(--schrift2); line-height:1.5}
  .mangel-status{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    white-space:nowrap; letter-spacing:.04em; flex-shrink:0;
  }
  .status-offen{background:#fff3e0; color:#9a3412}
  .status-behoben{background:#dcfce7; color:#166534}
  .status-kritisch{background:#fef2f2; color:#991b1b}

  /* Projekt-Chip */
  .projekt-chip{
    display:inline-block; background:var(--wn-blau); color:#fff;
    font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin-bottom:4px;
    letter-spacing:.04em;
  }

  /* Statistik-Reihe */
  .stat-reihe{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
  .stat-karte{background:var(--karte); border-radius:var(--radius); padding:14px 10px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stat-zahl{font-size:28px; font-weight:800; line-height:1}
  .stat-label{font-size:11px; font-weight:600; color:var(--schrift2); margin-top:4px; text-transform:uppercase; letter-spacing:.04em}
  .farbe-blau{color:var(--wn-blau)}
  .farbe-orange{color:var(--wn-orange)}
  .farbe-gruen{color:var(--wn-gruen)}
  .farbe-rot{color:var(--wn-akzent)}

  /* Foto-Grid */
  .foto-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}

  /* Info-Zeilen in Detailansicht */
  .info-zeile{display:flex; padding:8px 0; border-bottom:1px solid var(--linie); font-size:14px}
  .info-zeile:last-child{border-bottom:none}
  .info-label{color:var(--schrift2); min-width:130px; flex-shrink:0; font-size:13px}
  .info-wert{font-weight:600; word-break:break-word}

  /* Filter-Reihe */
  .filter-reihe{display:grid; grid-template-columns:1fr 1fr; gap:10px}

  /* Stammdaten-Chips */
  .stamm-chip-liste{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .stamm-chip{
    display:flex; align-items:center; gap:5px;
    background:var(--wn-grau-hell); border-radius:20px;
    padding:5px 10px; font-size:13px; border:1px solid var(--linie);
  }
  .stamm-chip button{
    background:none; border:none; color:var(--schrift2); cursor:pointer;
    font-size:16px; line-height:1; padding:0; display:flex; align-items:center;
  }
  .stamm-add-reihe{display:flex; gap:8px; align-items:center}
  .stamm-add-reihe input{flex:1; margin:0}
  .stamm-add-reihe .btn{margin-top:0; width:auto}

  /* Meldung */
  #meldung{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--wn-blau); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:14px; font-weight:600; z-index:9999; display:none;
    box-shadow:0 4px 16px rgba(0,0,0,.25); max-width:90%; text-align:center;
    animation:einblenden .2s ease;
  }
  @keyframes einblenden{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* Dialog */
  #dialog-hintergrund{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center;padding:20px}
  #dialog-hintergrund.aktiv{display:flex}
  #dialog-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2)}
  #dialog-box h3{font-size:17px;font-weight:800;color:var(--schrift);margin-bottom:8px}
  #dialog-box p{font-size:14px;color:var(--schrift2);margin-bottom:20px;line-height:1.5}
  .dialog-btn-reihe{display:flex;gap:8px}
  .dialog-btn-reihe .btn{flex:1;margin:0}

  /* Passwort-Screen */
  #pw-screen{
    position:fixed; inset:0; background:var(--wn-blau);
    display:flex; align-items:center; justify-content:center;
    z-index:10000; padding:24px;
  }
  #pw-screen:not(.aktiv){display:none}
  .pw-box{
    background:#fff; border-radius:16px; padding:36px 28px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .pw-logo{margin-bottom:20px}
  .pw-box h2{font-size:20px; font-weight:800; color:var(--wn-blau); margin-bottom:6px}
  .pw-box p{font-size:13px; color:var(--schrift2); margin-bottom:24px; line-height:1.5}
  .pw-box input{margin-bottom:0; font-size:18px; letter-spacing:.1em; text-align:center}

  /* Leer-Zustand */
  .leer{text-align:center; padding:40px 20px; color:var(--schrift2)}
  .leer svg{margin-bottom:14px; opacity:.4}
  .leer p{font-size:14px; line-height:1.6}

  /* Karte Auswahl */
  #karteWahl{height:220px; border-radius:var(--radius-s); display:none; border:1.5px solid var(--linie); margin-top:8px}
  .gps-info{font-size:12px; color:var(--schrift2); margin-top:5px}

  /* Bildlupe */
  #bildLupe{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
  #bildLupe.aktiv{display:flex}
  #bildLupe img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  #bildLupe-schliessen{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;line-height:1;padding:6px 12px;border-radius:8px;cursor:pointer}

  /* Druckbereich versteckt */
  #druckBereich{
    position:fixed; left:-9999px; top:0; width:800px;
    background:#fff; padding:32px; font-family:Arial,sans-serif; color:#000;
  }
  .druck-kopf{font-size:20px; font-weight:800; margin-bottom:16px; color:#003976; border-bottom:3px solid #003976; padding-bottom:10px}
  .druck-info{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px}
  .druck-info td{padding:5px 8px; border-bottom:1px solid #eee}
  .druck-info td:first-child{font-weight:700; color:#6e7275; width:38%}
  .druck-kommentar{background:#f4f5f6; padding:12px; border-radius:6px; font-size:13px; line-height:1.6; margin-top:10px}
  .druck-foto{width:180px; height:180px; object-fit:cover; border-radius:6px}
  .druck-trenner{border:none; border-top:2px solid #e2e8f0; margin:16px 0}

  /* Kritisch-Banner */

<script>
// ===== KONSTANTEN =====
const PASSWORT = 'holti';

// Feste Projekte, nicht editierbar
const PROJEKTE = ['Bestwig', 'Ense', 'Möhnesee', 'Arnsberg'];

// 10 Mängeltypen/Kategorien
const STANDARD_KATEGORIEN = [
  'Asphalt fehlt',
  'Pflasterregulierung',
  'Rückenstütze fehlt',
  'Bankett mangelhaft',
  'Schaden beim Kunden',

  'Fehlende Asphaltnaht',
  'Einfassung mangelhaft',
  'Einführung mangelhaft'
];

// 11 vordefinierte Aktionen (Tippfehler korrigiert)
const STANDARD_AKTIONEN = [
  'Pflaster regulieren',
  'Bankett wiederherstellen / Mutterboden anfüllen + Rasen einsäen',
  'Schaden regulieren',
  'HA an Längstrasse anbinden',
  'Asphalt einbauen / Rückschnitt beachten',
  'Pflaster regulieren + einsanden',
  'Querung bauen',
  'TOK-Band einbauen oder vergießen',
  'Asphalt als Provisorium einbauen',
  'Kantenstein neu setzen',
  'Einführung regulieren'
];

// Farben je Kategorie für Auswertung
const MANGEL_FARBEN = {
  'Asphalt fehlt': '#003976',
  'Pflasterregulierung': '#0057a8',
  'Rückenstütze fehlt': '#1a5fa8',
  'Bankett mangelhaft': '#e87722',
  'Schaden beim Kunden': '#e4001b',
  'Nicht fertig gebauter HA': '#7c3aed',
  'Fehlende Querung': '#00843d',
  'Fehlende Asphaltnaht': '#6e7275',
  'Einfassung mangelhaft': '#b45309',
  'Einführung mangelhaft': '#0e7490'
};

// Firebase Konfiguration
const firebaseConfig = {
  apiKey: "AIzaSyCpW-NnQwU9Lb08brlkLdqG6Xh3ZqsYKwg",
  authDomain: "pl-holterhoff-baustellen-qs.firebaseapp.com",
  projectId: "pl-holterhoff-baustellen-qs",
  storageBucket: "pl-holterhoff-baustellen-qs.firebasestorage.app",
  messagingSenderId: "544503869793",
  appId: "1:544503869793:web:994f2dd081628bfb9f5520"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = 'maengel_v2';

// ===== ZUSTAND =====
let stammdaten = {
  firmen: [],
  projektleiter: [],
  kategorien: [...STANDARD_KATEGORIEN]
};
let mangelIndex = [];
let mangelEntwurf = neuerMangelEntwurf();
let mangelFilter = { kategorie: '', firma: '', eintrager: '', status: '', projekt: '', mangelTyp: '', von: '', bis: '' };
let karteInstanz = null;
let karteMarker = null;
let aktiverFotoTarget = null;
let echtzeitAbmelden = null;

// ===== HILFSFUNKTIONEN =====
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function heute() {
  return new Date().toISOString().slice(0, 10);
}

function datumSchoen(d) {
  if (!d) return '';
  const [j, m, t] = d.split('-');
  return `${t}.${m}.${j}`;
}

function zeitSchoen(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function csvFeld(v) {
  const s = String(v ?? '');
  return s.includes(';') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s;
}

let meldungTimer = null;
function meldung(text) {
  const el = document.getElementById('meldung');
  el.textContent = text;
  el.style.display = 'block';
  if (meldungTimer) clearTimeout(meldungTimer);
  meldungTimer = setTimeout(() => { el.style.display = 'none'; }, 2800);
}

function bestaetigung(titel, text, okText, cb) {
  document.getElementById('dialog-titel').textContent = titel;
  document.getElementById('dialog-text').textContent = text;
  const okBtn = document.getElementById('dialog-ok');
  okBtn.textContent = okText;
  okBtn.onclick = () => { dialogSchliessen(); cb(); };
  document.getElementById('dialog-hintergrund').classList.add('aktiv');
}

function dialogSchliessen() {
  document.getElementById('dialog-hintergrund').classList.remove('aktiv');
}

function bildGross(src) {
  document.getElementById('bildLupe-bild').src = src;
  document.getElementById('bildLupe').classList.add('aktiv');
}

function neuerMangelEntwurf() {
  return {
    id: neueId(), kategorie: '', aktion: '', mangelTyp: '',
    firma: '', eintrager: '', subunternehmer: '',
    keinSubunternehmer: false, projekt: '', kommentar: '', fotos: [],
    strasse: '', ort: '', lat: null, lng: null,
    datum: heute(), gespeichertAm: null, behoben: false, behobenAm: null, kritisch: false
  };
}

// ===== FIRESTORE SPEICHER =====
async function speicherSetzen(schluessel, wert) {
  await db.collection(COL).doc(schluessel).set(wert);
}

async function speicherHolen(schluessel) {
  const snap = await db.collection(COL).doc(schluessel).get();
  return snap.exists ? snap.data() : null;
}

async function speicherLoeschen(schluessel) {
  await db.collection(COL).doc(schluessel).delete();
}

async function stammdatenLaden() {
  const d = await speicherHolen('stammdaten_maengel');
  if (d) {
    // Kategorien immer aus Konstante, nicht editierbar
    stammdaten = {
      firmen: d.firmen || [],
      projektleiter: d.projektleiter || [],
      kategorien: [...STANDARD_KATEGORIEN]
    };
  }
}

async function stammdatenSpeichern() {
  await speicherSetzen('stammdaten_maengel', {
    firmen: stammdaten.firmen,
    projektleiter: stammdaten.projektleiter,
    kategorien: [...STANDARD_KATEGORIEN]
  });
}

async function mangelIndexLaden() {
  meldung('Mängel werden geladen…');
  const snap = await db.collection(COL)
    .where('__typ', '==', 'index')
    .orderBy('gespeichertAm', 'desc')
    .get().catch(async () => {
      // Fallback: alle Dokumente laden und filtern
      const alle = await db.collection(COL).get();
      return { docs: alle.docs.filter(d => d.id.startsWith('mangelindex:')) };
    });
  mangelIndex = snap.docs
    ? snap.docs.map(d => d.data())
    : [];
  if (!mangelIndex.length) {
    // Fallback-Laden über ID-Präfix
    const alle = await db.collection(COL).get();
    mangelIndex = alle.docs
      .filter(d => d.id.startsWith('mangelindex:'))
      .map(d => d.data())
      .sort((a, b) => (b.gespeichertAm || '').localeCompare(a.gespeichertAm || ''));
  }
  meldung('');
}

function echtzeitStarten() {
  if (echtzeitAbmelden) echtzeitAbmelden();
  echtzeitAbmelden = db.collection(COL).onSnapshot(snap => {
    const neueIndex = [];
    snap.docs.forEach(d => {
      if (d.id.startsWith('mangelindex:')) neueIndex.push(d.data());
    });
    if (neueIndex.length) {
      mangelIndex = neueIndex.sort((a, b) => (b.gespeichertAm || '').localeCompare(a.gespeichertAm || ''));
      zeichneAktuellenTab();
    }
    document.getElementById('online-punkt').style.background = '#4ade80';
  }, () => {
    document.getElementById('online-punkt').style.background = '#f87171';
  });
}

// ===== NAVIGATION =====
let aktiverTab = 'mangel';
function zeigeTab(tab) {
  aktiverTab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => {
    b.classList.toggle('aktiv', b.dataset.tab === tab);
  });
  zeichneAktuellenTab();
}

function zeichneAktuellenTab() {
  if (aktiverTab === 'mangel') zeichneMangel();
  else if (aktiverTab === 'logbuch') zeichneLogbuch();
  else if (aktiverTab === 'auswertung') zeichneAuswertung();
  else if (aktiverTab === 'stammdaten') zeichneStammdaten();
}

// ===== PASSWORT =====
function passwortPruefen() {
  const pw = document.getElementById('pw-feld').value;
  if (pw === PASSWORT) {
    localStorage.setItem('maengel_auth', 'ja');
    document.getElementById('pw-screen').classList.remove('aktiv');
    app_start();
  } else {
    meldung('Falsches Passwort');
    document.getElementById('pw-feld').value = '';
  }
}
document.getElementById('pw-feld').addEventListener('keydown', e => {
  if (e.key === 'Enter') passwortPruefen();
});

function karteOeffnenOderGPS() {
  if (navigator.geolocation) {
    meldung('GPS wird ermittelt…');
    navigator.geolocation.getCurrentPosition(pos => {
      mangelEntwurf.lat = parseFloat(pos.coords.latitude.toFixed(6));
      mangelEntwurf.lng = parseFloat(pos.coords.longitude.toFixed(6));
      zeichneMangel();
      setTimeout(() => karteInitiieren(), 100);
    }, () => {
      meldung('GPS nicht verfügbar, Karte zum Tippen öffnen');
      karteInitiierenOhnePunkt();
    }, { enableHighAccuracy: true, timeout: 8000 });
  } else {
    karteInitiierenOhnePunkt();
  }
}

function karteInitiieren() {
  const el = document.getElementById('karteWahl');
  if (!el) return;
  el.style.display = 'block';
  if (karteInstanz) { karteInstanz.remove(); karteInstanz = null; }
  const lat = mangelEntwurf.lat || 51.4;
  const lng = mangelEntwurf.lng || 8.0;
  karteInstanz = L.map('karteWahl').setView([lat, lng], 16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(karteInstanz);
  if (mangelEntwurf.lat) {
    karteMarker = L.marker([lat, lng], { draggable: true }).addTo(karteInstanz);
    karteMarker.on('dragend', e => {
      const p = e.target.getLatLng();
      mangelEntwurf.lat = parseFloat(p.lat.toFixed(6));
      mangelEntwurf.lng = parseFloat(p.lng.toFixed(6));
    });
  }
  karteInstanz.on('click', e => {
    mangelEntwurf.lat = parseFloat(e.latlng.lat.toFixed(6));
    mangelEntwurf.lng = parseFloat(e.latlng.lng.toFixed(6));
    if (karteMarker) karteInstanz.removeLayer(karteMarker);
    karteMarker = L.marker([mangelEntwurf.lat, mangelEntwurf.lng], { draggable: true }).addTo(karteInstanz);
    karteMarker.on('dragend', ev => {
      const p = ev.target.getLatLng();
      mangelEntwurf.lat = parseFloat(p.lat.toFixed(6));
      mangelEntwurf.lng = parseFloat(p.lng.toFixed(6));
    });
  });
  setTimeout(() => karteInstanz.invalidateSize(), 200);
}

function karteInitiierenOhnePunkt() {
  const el = document.getElementById('karteWahl');
  if (!el) return;
  el.style.display = 'block';
  karteInitiieren();
}

function fotoAnfordern(quelle) {
  aktiverFotoTarget = 'mangel';
  document.getElementById(quelle === 'kamera' ? 'fotoKamera' : 'fotoGalerie').click();
}

function mangelFotoEntfernen(i) {
  mangelEntwurf.fotos.splice(i, 1);
  zeichneMangel();
}

function fotoVerarbeiten(datei) {
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      let w = img.width, h = img.height;
      if (w > h && w > max) { h = h * max / w; w = max; }
      else if (h >= w && h > max) { w = w * max / h; h = max; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const datenUrl = c.toDataURL('image/jpeg', 0.78);
      mangelEntwurf.fotos.push(datenUrl);
      zeichneMangel();
    };
    img.src = ev.target.result;
  };
  leser.readAsDataURL(datei);
}

document.getElementById('fotoKamera').addEventListener('change', e => { fotoVerarbeiten(e.target.files[0]); e.target.value = ''; });
document.getElementById('fotoGalerie').addEventListener('change', e => { fotoVerarbeiten(e.target.files[0]); e.target.value = ''; });

async function mangelSpeichern() {
  const m = mangelEntwurf;

  // Plausibilitätsprüfung aller Pflichtfelder
  if (!m.mangelTyp) { meldung('Bitte "Baumangel" oder "Unfertige Leistung" auswählen'); return; }
  if (!m.kategorie) { meldung('Bitte Mängelkategorie auswählen'); return; }
  if (!m.aktion) { meldung('Bitte vorzunehmende Maßnahme auswählen'); return; }
  if (!m.projekt) { meldung('Bitte Projekt auswählen'); return; }
  if (!m.firma) { meldung('Bitte Tiefbaufirma auswählen'); return; }
  if (!m.keinSubunternehmer && !m.subunternehmer) { meldung('Bitte Subunternehmer auswählen oder "Kein Subunternehmer" ankreuzen'); return; }
  if (!m.eintrager) { meldung('Bitte "Erfasst durch" auswählen'); return; }
  if (!m.datum) { meldung('Bitte Datum angeben'); return; }

  // Plausibilitätsprüfung Datum
  if (m.datum > heute()) { meldung('Das Datum liegt in der Zukunft'); return; }

  meldung('Wird gespeichert…');
  const jetzt = new Date().toISOString();
  m.gespeichertAm = jetzt;

  // Fotos einzeln speichern
  const fotoAnzahl = m.fotos.length;
  const fotos = [...m.fotos];
  for (let i = 0; i < fotos.length; i++) {
    await speicherSetzen('mangelfoto:' + m.id + ':' + i, { daten: fotos[i] });
  }

  const mangelZumSpeichern = { ...m, fotos: [], fotoAnzahl };
  await speicherSetzen('mangel:' + m.id, mangelZumSpeichern);

  // Index-Dokument für schnelle Listenansicht
  const meta = {
    id: m.id, kategorie: m.kategorie, aktion: m.aktion, mangelTyp: m.mangelTyp,
    firma: m.firma, subunternehmer: m.subunternehmer || '',
    keinSubunternehmer: m.keinSubunternehmer, eintrager: m.eintrager,
    projekt: m.projekt || '', datum: m.datum, gespeichertAm: jetzt,
    behoben: false, behobenAm: null, kritisch: m.kritisch, fotoAnzahl,
    strasse: m.strasse, ort: m.ort, lat: m.lat, lng: m.lng,
    __typ: 'index'
  };
  await speicherSetzen('mangelindex:' + m.id, meta);

  mangelIndex.unshift(meta);
  meldung('Mangel wurde gespeichert');
  mangelZuruecksetzen();
  zeigeTab('logbuch');
}

function mangelZuruecksetzen() {
  if (karteInstanz) { karteInstanz.remove(); karteInstanz = null; }
  karteMarker = null;
  mangelEntwurf = neuerMangelEntwurf();
  zeichneMangel();
}

function mangelIndexGefiltert() {
  return mangelIndex.filter(e => {
    if (mangelFilter.kategorie && e.kategorie !== mangelFilter.kategorie) return false;
    if (mangelFilter.firma && e.firma !== mangelFilter.firma) return false;
    if (mangelFilter.eintrager && e.eintrager !== mangelFilter.eintrager) return false;
    if (mangelFilter.projekt && e.projekt !== mangelFilter.projekt) return false;
    if (mangelFilter.mangelTyp && e.mangelTyp !== mangelFilter.mangelTyp) return false;
    if (mangelFilter.status === 'offen' && e.behoben) return false;
    if (mangelFilter.status === 'behoben' && !e.behoben) return false;
    if (mangelFilter.von && e.datum < mangelFilter.von) return false;
    if (mangelFilter.bis && e.datum > mangelFilter.bis) return false;
    return true;
  });
}

function filterZuruecksetzen() {
  mangelFilter = { kategorie: '', firma: '', eintrager: '', status: '', projekt: '', mangelTyp: '', von: '', bis: '' };
  zeichneLogbuch();
}

async function druckStarten(bereich, dateiname) {
  try {
    const bilder = [...bereich.querySelectorAll('img')];
    await Promise.all(bilder.map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })));
    const { jsPDF } = window.jspdf;
    const canvas = await html2canvas(bereich, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/jpeg', 0.9);
    const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
    const hoehe = Math.round(canvas.height * 190 / canvas.width);
    let y = 10;
    const seitenHoehe = 277;
    if (hoehe <= seitenHoehe) {
      pdf.addImage(imgData, 'JPEG', 10, y, 190, hoehe);
    } else {
      let verbleibend = hoehe;
      let yOffset = 0;
      while (verbleibend > 0) {
        const teil = Math.min(seitenHoehe, verbleibend);
        const anteil = teil / hoehe;
        const teilCanvas = document.createElement('canvas');
        teilCanvas.width = canvas.width;
        teilCanvas.height = Math.round(canvas.height * anteil);
        const ctx = teilCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, Math.round(yOffset / hoehe * canvas.height), canvas.width, teilCanvas.height, 0, 0, canvas.width, teilCanvas.height);
        if (yOffset > 0) pdf.addPage();
        pdf.addImage(teilCanvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, 190, teil);
        yOffset += teil;
        verbleibend -= teil;
      }
    }
    // PDF über Downloads API speichern
    const pdfBlob = pdf.output('blob');
    try {
      const downloads = await claude.use('downloads');
      await downloads.save({ filename: dateiname, data: pdfBlob });
      meldung('PDF wurde gespeichert');
    } catch (e) {
      // Fallback falls API nicht verfügbar
      pdf.save(dateiname);
      meldung('PDF wurde gespeichert');
    }
  } catch (err) {
    console.error(err);
    meldung('PDF konnte nicht erstellt werden: ' + err.message);
  }
}

function zeichneAuswertung() {
  const offen = mangelIndex.filter(e => !e.behoben).length;
  const behoben = mangelIndex.filter(e => e.behoben).length;
  const kritisch = mangelIndex.filter(e => e.kritisch && !e.behoben).length;
  const gesamt = mangelIndex.length;
  const baumangel = mangelIndex.filter(e => e.mangelTyp === 'Baumangel').length;
  const unfertig = mangelIndex.filter(e => e.mangelTyp === 'Unfertige Leistung').length;

  // Zählung nach Kategorie
  const katZaehlung = {};
  STANDARD_KATEGORIEN.forEach(k => { katZaehlung[k] = { offen: 0, behoben: 0 }; });
  mangelIndex.forEach(e => {
    if (!katZaehlung[e.kategorie]) katZaehlung[e.kategorie] = { offen: 0, behoben: 0 };
    if (e.behoben) katZaehlung[e.kategorie].behoben++;
    else katZaehlung[e.kategorie].offen++;
  });

  // Zählung nach Projekt
  const projektZaehlung = {};
  PROJEKTE.forEach(p => { projektZaehlung[p] = 0; });
  mangelIndex.forEach(e => {
    if (e.projekt) projektZaehlung[e.projekt] = (projektZaehlung[e.projekt] || 0) + 1;
  });

  // Zählung nach Firma
  const firmaZaehlung = {};
  mangelIndex.forEach(e => {
    if (!e.firma) return;
    if (!firmaZaehlung[e.firma]) firmaZaehlung[e.firma] = 0;
    firmaZaehlung[e.firma]++;

  // Monats-Verlauf
  const monatsDaten = {};
  mangelIndex.forEach(e => {
    if (!e.datum) return;
    const m = e.datum.slice(0, 7);
    if (!monatsDaten[m]) monatsDaten[m] = 0;
    monatsDaten[m]++;

  const monateGeordnet = Object.keys(monatsDaten).sort();

  const maxKat = Math.max(1, ...STANDARD_KATEGORIEN.map(k => (katZaehlung[k]?.offen || 0) + (katZaehlung[k]?.behoben || 0)));

  document.getElementById('app').innerHTML = `

        <div class="stat-label">Gesamt</div>
      </div>
      <div class="stat-karte">
        <div class="stat-zahl farbe-orange">${offen}</div>
        <div class="stat-label">Offen</div>
      </div>
      <div class="stat-karte">
        <div class="stat-zahl farbe-gruen">${behoben}</div>
        <div class="stat-label">Behoben</div>
      </div>
    </div>

    ${kritisch > 0 ? `<div class="kritisch-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      ${kritisch} kritische Mängel offen
    </div>` : ''}

    <div class="karte">

        </div>
        <div style="flex:1; background:#fefce8; border-radius:var(--radius-s); padding:14px; text-align:center">
          <div style="font-size:26px; font-weight:800; color:#854d0e">${unfertig}</div>
          <div style="font-size:12px; font-weight:700; color:#854d0e; text-transform:uppercase; margin-top:4px">Unfertige Leistungen</div>

    <div class="karte">
      <h3>Nach Projekt</h3>
      ${PROJEKTE.map(p => {
        const n = projektZaehlung[p] || 0;
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--linie); font-size:14px">
          <span style="font-weight:600">${esc(p)}</span>

      }).join('')}

    <div class="karte">
      <h3>Nach Mängelkategorie</h3>
      ${STANDARD_KATEGORIEN.map(k => {
        const d = katZaehlung[k] || { offen: 0, behoben: 0 };
        const gesKat = d.offen + d.behoben;
        const farbe = MANGEL_FARBEN[k] || '#94a3b8';
        return `<div style="margin-bottom:11px">
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px">
            <span style="font-weight:600">${esc(k)}</span>
            <span style="color:var(--schrift2)">${gesKat} (${d.offen} offen)</span>
          </div>
          <div style="background:#f1f5f9; border-radius:5px; height:8px; overflow:hidden">
            ${gesKat > 0 ? `<div style="background:${farbe}; height:100%; width:${Math.round(gesKat / maxKat * 100)}%; border-radius:5px; transition:width .3s"></div>` : ''}
          </div>

    ${Object.keys(firmaZaehlung).length ? `<div class="karte">
      <h3>Nach Firma</h3>
      ${Object.entries(firmaZaehlung).sort((a, b) => b[1] - a[1]).map(([f, n]) => `
        <div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--linie); font-size:14px">
          <span>${esc(f)}</span>

    ${monateGeordnet.length > 1 ? `<div class="karte">
      <h3>Mängel je Monat</h3>
      ${monatsSvg(monateGeordnet.map(m => ({ label: m.slice(5) + '/' + m.slice(2, 4), anzahl: monatsDaten[m] })))}
    </div>` : ''}

    <div class="btn-reihe" style="margin-top:4px">
      <button class="btn btn-grau btn-sm" onclick="maengellistePDF()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Gesamtliste PDF
      </button>
      <button class="btn btn-grau btn-sm" onclick="mangelFilter={}; zeigeTab('logbuch'); csvExportieren()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CSV Export
      </button>
    </div>`;
}

function monatsSvg(daten) {
  const max = Math.max(1, ...daten.map(d => d.anzahl));
  const h = 90, oben = 8, unten = 20;
  const nutzH = h - oben - unten;
  const breite = 300;
  const schritt = breite / daten.length;
  const bBreite = Math.min(32, schritt - 8);
  let svg = `<svg viewBox="0 0 ${breite} ${h}" width="100%" style="display:block">`;
  daten.forEach((d, i) => {
    const bh = Math.round(nutzH * d.anzahl / max);
    const x = i * schritt + (schritt - bBreite) / 2;
    const y = oben + (nutzH - bh);
    svg += `<rect x="${x}" y="${y}" width="${bBreite}" height="${Math.max(bh, 2)}" rx="3" fill="#003976"/>`;
    svg += `<text x="${x + bBreite / 2}" y="${h - 4}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(d.label)}</text>`;
    svg += `<text x="${x + bBreite / 2}" y="${y - 3}" font-size="10" fill="#374151" text-anchor="middle">${d.anzahl}</text>`;
  });
  svg += '</svg>';
  return svg;
}

      <div style="display:flex; flex-wrap:wrap; gap:6px; padding:4px 0">

      </div>
      <div class="aktion-info" style="margin-top:8px">Projekte sind fest vorgegeben und können nicht geändert werden</div>
    </div>

    <div class="karte">
      <h3>Mängelkategorien</h3>

    </div>

    <div class="karte">

      <div class="stamm-chip-liste" id="firmen-liste">

      <div class="stamm-add-reihe">
        <input type="text" id="firma-neu" placeholder="Firmenname eingeben">
        <button class="btn btn-blau btn-sm" onclick="stammHinzufuegen('firmen','firma-neu')">+ Hinzufügen</button>

    </div>

    <div class="karte">
      <h3>Projektleiter / Erfasser</h3>

      </div>

        <input type="text" id="pl-neu" placeholder="Name Projektleiter">
        <button class="btn btn-blau btn-sm" onclick="stammHinzufuegen('projektleiter','pl-neu')">+ Hinzufügen</button>
      </div>

  ['firma-neu', 'pl-neu'].forEach(id => {

async function stammHinzufuegen(liste, feldId) {
  const el = document.getElementById(feldId);
  const wert = el ? el.value.trim() : '';
  if (!wert) return;
  if (!stammdaten[liste]) stammdaten[liste] = [];
  if (stammdaten[liste].includes(wert)) { meldung('Bereits vorhanden'); return; }
  stammdaten[liste].push(wert);
  stammdaten[liste].sort();
  await stammdatenSpeichern();
  if (el) el.value = '';
  zeichneStammdaten();
  meldung('Gespeichert');
}

async function stammLoeschen(liste, wert) {
  stammdaten[liste] = (stammdaten[liste] || []).filter(x => x !== wert);
  await stammdatenSpeichern();
  zeichneStammdaten();
}

function abmelden() {
  bestaetigung('App abmelden', 'Möchten Sie sich wirklich abmelden?', 'Abmelden', () => {
    localStorage.removeItem('maengel_auth');
    location.reload();
  });
}

// ===== APP START =====
async function app_start() {
  meldung('Verbindung wird hergestellt…');
  await stammdatenLaden();
  await mangelIndexLaden();
  echtzeitStarten();
  zeichneAktuellenTab();
}

// Passwort prüfen beim Laden
if (localStorage.getItem('maengel_auth') === 'ja') {
  document.getElementById('pw-screen').classList.remove('aktiv');
  app_start();
}
